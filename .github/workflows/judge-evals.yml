name: Judge evals

# B2-07: separate from ci.yml on purpose -- this makes real, non-free Vertex
# API calls with non-deterministic latency (see tests/test_judge_evals.py),
# so it only runs when a change could plausibly move the judge's verdicts:
# the judge/prompt code itself, or the eval cases/harness.
on:
  push:
    branches: [main]
    paths:
      - "app/engine/judge/**"
      - "evals/**"
      - "tests/test_judge_evals.py"
  pull_request:
    paths:
      - "app/engine/judge/**"
      - "evals/**"
      - "tests/test_judge_evals.py"

jobs:
  judge-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Write GCP service account key
        run: echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/gcp-key.json"

      - name: Run judge evals
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GCP_LOCATION }}
        # pyproject.toml's default pytest `timeout = 120` is sized for the
        # DB/unit suite -- this test makes 15+ sequential real Vertex calls
        # in one test function (~140s measured locally), so it needs its own
        # longer budget or it fails on a timeout regardless of whether the
        # judge is actually correct.
        run: uv run pytest -m judge_evals -v --timeout=300 tests/test_judge_evals.py
