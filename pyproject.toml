[project]
name = "cadence-brain"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
# loguru and the opentelemetry-* packages were already present transitively
# (via pipecat-ai/livekit-agents) and imported directly without being
# declared -- app/engine/caller/persona_call.py has done this for loguru
# since B2-04. B2-09 (app/observability/*) builds a real subsystem on top of
# both, so they're promoted to direct/pinned dependencies here: a future
# pipecat/livekit-agents upgrade that happens to drop one of these
# transitively should not be able to silently break tracing/logging.
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "google-cloud-speech>=2.40.0",
    "google-cloud-texttospeech>=2.37.0",
    "google-genai>=2.16.0",
    "jinja2>=3.1.6",
    "livekit-agents>=1.6.8",
    "livekit-plugins-google>=1.6.8",
    "loguru>=0.7.3",
    "numpy>=2.4.6",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pipecat-ai[google,livekit,silero]>=1.7.0",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate` — op.f() constraint names
# push lines past 100 chars; hand-wrapping them fights the next autogenerate.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern is `param: T = Depends(...)` — the call in the default
# is idiomatic here, not the mutable-default footgun B008 guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^migrations/versions/"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "judge_evals: golden judge eval harness (B2-07) -- real Vertex calls, costs money/latency, excluded from the default run; invoke explicitly with `pytest -m judge_evals`.",
]
# judge_evals makes real (non-free, non-deterministic-latency) Vertex API
# calls -- it's a separate gate (see .github/workflows/judge-evals.yml), not
# part of the default `pytest -q` every push/PR runs.
addopts = "-m 'not judge_evals'"
# A stalled Postgres connection establishment against the (distant, us-east-1)
# Neon test branch has no timeout of its own that reliably fires (asyncpg's
# connect_args timeout is loose -- observed taking up to ~18s despite being
# configured for 10s) -- without this, the pre-commit hook's `uv run pytest`
# can hang indefinitely on a single stalled connection instead of failing
# that one test and moving on.
timeout = 120
timeout_method = "thread"
